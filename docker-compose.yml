services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llamacpp
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/home/admin/llama/models:/models:Z
    environment:
      - LD_LIBRARY_PATH=/app
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
    privileged: false
    ipc: host
    restart: always
    command: >
      -m /models/gemma-4-26B-A4B-it-UD-Q3_K_XL.gguf
      --mmproj /models/mmproj-BF16.gguf
      --port 8081
      --host 0.0.0.0
      -c 65536
      -b 512
      -ub 512
      --parallel 1
      --threads 6
      -fa on
      -ctk q5_1
      -ctv q5_1
      --temp 0.7
      --cache-ram 65536
      --no-mmap
      -ngl 99

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    privileged: false
    labels:
      - "io.containers.autoupdate=registry"
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data:Z
    environment:
      - OPENAI_API_BASE_URL=http://llamacpp:8081/v1
    depends_on:
      - llamacpp
    restart: always

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Vancouver
    volumes:
      - /var/home/admin/calibre-web:/config:Z
      - /var/home/admin/calibre-library:/books:Z
    ports:
      - "8083:8083"
    restart: unless-stopped

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    user: '1000:1000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - ${UPLOAD_LOCATION}:/data:Z
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    user: '1000:1000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - ${ML_CACHE}:/cache:Z
      - ${ML_DOTCACHE}:/.cache:Z
      - ${ML_CONFIG}:/.config:Z
    env_file:
      - .env
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8436e10bc65c94886a91d4415b6a6dfa9cb5a306fb3b996e5bb67cd2b4854193
    user: '1000:1000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - ${REDIS_DATA}:/data:Z
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    user: '1000:1000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data:Z
    shm_size: 128mb
    restart: always

  searxng-core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - "${SEARXNG_PORT:-8123}:${SEARXNG_PORT:-8123}"
    env_file: .env
    volumes:
      - ${SEARXNG_CONFIG_DIR}:/etc/searxng/:Z
      - core-data:/var/cache/searxng/:Z

  searxng-valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/:Z

volumes:
  open-webui:
  model-cache:
  core-data:
  valkey-data:
